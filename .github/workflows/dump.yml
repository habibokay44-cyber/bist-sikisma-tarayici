name: Veri dökümü (ayar için)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/dump_prices.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add debug/prices.csv.gz
          git commit -m "veri dökümü" || echo "değişiklik yok"
          git pull --rebase && git push
