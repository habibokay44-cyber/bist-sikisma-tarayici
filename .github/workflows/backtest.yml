name: Backtest (elle çalıştır)

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Geçmiş süre (örn 2y, 3y, 5y)"
        default: "3y"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          set -o pipefail
          python scanner.py --backtest --period ${{ inputs.period }} | tee output/backtest_summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: |
            output/backtest_trades.csv
            output/backtest_summary.txt
